version: '3.9'
services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    hostname: metabase
    volumes:
      - /dev/urandom:/dev/random:ro
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: monitoring
      MB_DB_PORT: 5436
      MB_DB_USER: monitoring_user
      MB_DB_PASS: monitoring_password_strongvery
      MB_DB_HOST: 46.29.239.208
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5