<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(title='Единая точка входа')}">
    <title>Единая точка входа</title>
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/header :: header(page='index')}"></div>

<main class="flex-grow-1">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="card-title text-center mb-0">Добро пожаловать в Банковскую систему</h3>
                    </div>
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <p class="lead">Единая точка входа для клиентов и сотрудников</p>
                        </div>

                        <div class="d-grid gap-2">
                            <a th:href="${loginUrl}" class="btn btn-primary btn-lg">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Войти в систему
                            </a>
                        </div>

                        <div class="mt-4">
                            <p class="text-center text-muted">
                                После входа вы получите доступ к системе в соответствии с вашими ролями.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
