spring:
  application:
    name: api-gateway
  config:
    import: optional:file:gateway/.env[.properties]
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.issuerUri}
          jwk-set-uri: ${keycloak.jwkSetUri}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USER}
      password: ${REDIS_PASSWORD}




  main:
    allow-bean-definition-overriding: true
    web-application-type: reactive

keycloak:
  issuerUri: ${ISSUER_URI}
  jwkSetUri: ${JWK_SET_URI}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  authorization-grant-type: authorization_code
  redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
  scope: openid,profile,email,roles,offline_access
  admin:
    realm: ${KEYCLOAK_ADMIN_REALM}
    username: ${KEYCLOAK_ADMIN_USERNAME}
    password: ${KEYCLOAK_ADMIN_PASSWORD}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL}
  realm: ${KEYCLOAK_REALM}
  logout-redirect-uri: ${server.servlet.context-path:}/

eureka:
  client:
    registry-fetch-interval-seconds: 3
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org:
      springframework:
        security: DEBUG
        security.oauth2.client: DEBUG
        security.oauth2.client.endpoint: TRACE
        security.oauth2.core: DEBUG
        web: DEBUG


server:
  reactive:
    session:
      cookie:
        name: SESSION_${spring.application.name}