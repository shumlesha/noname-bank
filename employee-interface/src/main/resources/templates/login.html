<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Вход в систему банка NoName для сотрудников">
    <title>Вход в систему | Банк NoName</title>
    <script>
        const storedTheme = localStorage.getItem('user_theme') || 'light';
        document.documentElement.setAttribute('data-theme', storedTheme);
    </script>
    <link rel="stylesheet" th:href="@{/employee/css/styles.css}">
    <link rel="stylesheet" th:href="@{/employee/css/theme.css}">
</head>
<body>
    <div class="container">
        <header class="auth-header">
            <div class="logo">
                <h1>Банк NoName</h1>
            </div>
        </header>
        
        <main class="main-content">
            <section class="auth-form-container">
                <h2>Вход в систему</h2>
                
                <div id="error-message" class="error-message" aria-live="polite" style="display: none;"></div>
                
                <form id="login-form" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required autocomplete="email">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Пароль:</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password">
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Войти</button>
                    </div>
                </form>
                
                <div class="form-footer">
                    <p>Ещё нет аккаунта? <a th:href="@{/employee/register}">Зарегистрироваться</a></p>
                </div>
            </section>
        </main>
        
        <footer class="main-footer">
            <p>&copy; 2025 Банк NoName. Все права защищены.</p>
        </footer>
    </div>


    <script type="module" th:src="@{/employee/js/init.js}"></script>
</body>
</html>
