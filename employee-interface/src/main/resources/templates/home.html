<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Личный кабинет сотрудника банка NoName">
    <title>Личный кабинет сотрудника | Банк NoName</title>
    <script>
        const storedTheme = localStorage.getItem('user_theme') || 'light';
        document.documentElement.setAttribute('data-theme', storedTheme);
    </script>
    <link rel="stylesheet" th:href="@{/employee/css/styles.css}">
    <link rel="stylesheet" th:href="@{/employee/css/theme.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="main-header">
            <div class="logo">
                <h1>Банк NoName</h1>
            </div>
            <div class="user-info">
                <span id="user-email" class="user-email"></span>
                <button id="theme-toggle-btn" class="btn btn-theme">
                    <i id="theme-toggle-icon" class="fas fa-moon"></i>
                    <span id="theme-toggle-text">Темная тема</span>
                </button>
                <button id="logout-btn" class="btn btn-logout">Выйти</button>
            </div>
        </header>

        <main class="main-content">
            <div class="tab-navigation">
                <a href="/employee/me" class="tab-button active">Профиль</a>
                <a href="/employee/accounts" class="tab-button">Счета клиентов</a>
                <a href="/employee/users" class="tab-button">Управление пользователями</a>
                <a href="/employee/credit-tariffs" class="tab-button">Тарифы кредитов</a>
            </div>

            <section class="welcome-section">
                <h2>Личный кабинет сотрудника</h2>
                <p>Добро пожаловать в систему управления банком NoName.</p>
            </section>

            <section class="profile-section">
                <h3>Информация о сотруднике</h3>
                <div class="user-details">
                    <div class="loading-indicator">
                        <span class="loading-text">Загрузка данных...</span>
                    </div>
                </div>
            </section>
        </main>

        <footer class="main-footer">
            <p>&copy; 2025 Банк NoName. Все права защищены.</p>
        </footer>
    </div>

    <script type="module" th:src="@{/employee/js/init.js}"></script>
</body>
</html>
