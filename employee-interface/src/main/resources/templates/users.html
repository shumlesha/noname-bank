<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Управление пользователями банка NoName">
    <title>Управление пользователями | Банк NoName</title>
    <script>
        const storedTheme = localStorage.getItem('user_theme') || 'light';
        document.documentElement.setAttribute('data-theme', storedTheme);
    </script>
    <link rel="stylesheet" th:href="@{/employee/css/styles.css}">
    <link rel="stylesheet" th:href="@{/employee/css/users.css}">
    <link rel="stylesheet" th:href="@{/employee/css/theme.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container">
    <header class="main-header">
        <div class="logo">
            <h1>Банк NoName</h1>
        </div>
        <div class="user-info">
            <span id="user-email" class="user-email"></span>
            <button id="theme-toggle-btn" class="btn btn-theme">
                <i id="theme-toggle-icon" class="fas fa-moon"></i>
                <span id="theme-toggle-text">Темная тема</span>
            </button>
            <button id="logout-btn" class="btn btn-logout">Выйти</button>
        </div>
    </header>

    <main class="main-content">
        <div class="tab-navigation">
            <a href="/employee/me" class="tab-button">Профиль</a>
            <a href="/employee/accounts" class="tab-button">Счета клиентов</a>
            <a href="/employee/users" class="tab-button active">Управление пользователями</a>
            <a href="/employee/credit-tariffs" class="tab-button">Тарифы кредитов</a>
        </div>

        <section class="users-section">
            <div class="users-header">
                <h2>Управление пользователями</h2>
                <button id="create-user-btn" class="btn btn-primary">Создать пользователя</button>
            </div>

            <div id="messages-container"></div>

            <div id="users-loading" class="loading-indicator">
                <span class="loading-text" style="font-style: normal;">Загрузка пользователей...</span>
            </div>

            <div id="users-container"></div>
            <div id="pagination-container" class="pagination-container"></div>
            <div id="user-details-container" style="display: none;"></div>
            <div id="user-details-loading" class="loading-indicator" style="display: none;">
                <span class="loading-text">Загрузка информации о пользователе...</span>
            </div>

            <div id="create-user-modal" class="modal" style="display: none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>Создание нового пользователя</h3>
                        <button id="close-create-user-modal-btn" class="btn btn-close">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div id="create-user-error" class="error-message" style="display: none;"></div>
                        
                        <form id="create-user-form" class="auth-form">
                            <div class="form-group">
                                <label for="create-email">Email:</label>
                                <input type="email" id="create-email" name="email" required autocomplete="email">
                            </div>
                            
                            <div class="form-group">
                                <label for="create-fullName">Полное имя:</label>
                                <input type="text" id="create-fullName" name="fullName" required autocomplete="name">
                            </div>
                            
                            <fieldset class="form-group">
                                <legend>Пол:</legend>
                                <div class="radio-group">
                                    <label class="radio-option">
                                        <input type="radio" name="create-gender" value="MALE" required> Мужской
                                    </label>
                                    <label class="radio-option">
                                        <input type="radio" name="create-gender" value="FEMALE"> Женский
                                    </label>
                                </div>
                            </fieldset>
                            
                            <fieldset class="form-group">
                                <legend>Роль:</legend>
                                <div class="checkbox-group">
                                    <label class="checkbox-option">
                                        <input type="checkbox" name="create-roles" value="CLIENT" checked> Клиент
                                    </label>
                                    <label class="checkbox-option">
                                        <input type="checkbox" name="create-roles" value="EMPLOYEE"> Сотрудник
                                    </label>
                                </div>
                            </fieldset>
                            
                            <div class="form-group">
                                <label for="create-password">Пароль:</label>
                                <input type="password" id="create-password" name="password" required autocomplete="new-password" 
                                       minlength="8" aria-describedby="password-hint">
                                <small id="password-hint" class="form-hint">Пароль должен содержать не менее 8 символов</small>
                            </div>
                            
                            <div class="form-group">
                                <label for="create-confirmPassword">Подтвердите пароль:</label>
                                <input type="password" id="create-confirmPassword" name="confirmPassword" required autocomplete="new-password">
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button id="cancel-create-user-btn" class="btn btn-secondary">Отмена</button>
                        <button id="submit-create-user-btn" class="btn btn-primary">Создать</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2025 Банк NoName. Все права защищены.</p>
    </footer>
</div>

<script type="module" th:src="@{/employee/js/init.js}"></script>
</body>
</html>
