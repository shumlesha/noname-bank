<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Управление пользователями банка NoName">
    <title>Управление пользователями | Банк NoName</title>
    <link rel="stylesheet" th:href="@{/employee/css/styles.css}">
    <link rel="stylesheet" th:href="@{/employee/css/users.css}">
</head>
<body>
<div class="container">
    <header class="main-header">
        <div class="logo">
            <h1>Банк NoName</h1>
        </div>
        <div class="user-info">
            <span id="user-email" class="user-email"></span>
            <button id="logout-btn" class="btn btn-logout">Выйти</button>
        </div>
    </header>

    <main class="main-content">
        <div class="tab-navigation">
            <a href="/employee/me" class="tab-button">Профиль</a>
            <a href="/employee/accounts" class="tab-button">Счета клиентов</a>
            <a href="/employee/users" class="tab-button active">Управление пользователями</a>
            <a href="/employee/credit-tariffs" class="tab-button">Тарифы кредитов</a>
        </div>

        <section class="users-section">
            <div class="users-header">
                <h2>Управление пользователями</h2>
            </div>

            <div id="messages-container"></div>

            <div id="users-loading" class="loading-indicator">
                <span class="loading-text" style="font-style: normal;">Загрузка пользователей...</span>
            </div>

            <div id="users-container"></div>
            <div id="pagination-container" class="pagination-container"></div>
            <div id="user-details-container" style="display: none;"></div>
            <div id="user-details-loading" class="loading-indicator" style="display: none;">
                <span class="loading-text">Загрузка информации о пользователе...</span>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2025 Банк NoName. Все права защищены.</p>
    </footer>
</div>

<script type="module" th:src="@{/employee/js/init.js}"></script>
</body>
</html>
