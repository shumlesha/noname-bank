<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Управление счетами клиентов банка NoName">
    <title>Счета клиентов | Банк NoName</title>
    <link rel="stylesheet" th:href="@{/employee/css/styles.css}">
    <link rel="stylesheet" th:href="@{/employee/css/accounts.css}">
</head>
<body>
<div class="container">
    <header class="main-header">
        <div class="logo">
            <h1>Банк NoName</h1>
        </div>
        <div class="user-info">
            <span id="user-email" class="user-email"></span>
            <button id="logout-btn" class="btn btn-logout">Выйти</button>
        </div>
    </header>

    <main class="main-content">
        <div class="tab-navigation">
            <a href="/employee/me" class="tab-button">Профиль</a>
            <a href="/employee/accounts" class="tab-button active">Счета клиентов</a>
            <a href="/employee/users" class="tab-button">Управление пользователями</a>
        </div>

        <section class="accounts-section">
            <div class="accounts-header">
                <h2>Счета клиентов</h2>
            </div>

            <form id="search-form" class="search-form">
                <input type="text" id="search-input" placeholder="Введите ID клиента для поиска счетов">
                <button type="submit" class="btn btn-primary">Найти</button>
            </form>

            <button id="back-to-list-btn" class="btn back-button" style="display: none;">Вернуться к списку всех счетов</button>

            <div id="messages-container"></div>

            <div id="accounts-loading" class="loading-indicator">
                <span class="loading-text">Загрузка счетов...</span>
            </div>

            <div id="accounts-container"></div>
            <div id="pagination-container" class="pagination-container"></div>
            <div id="account-details-container" style="display: none;"></div>
            <div id="account-details-loading" class="loading-indicator" style="display: none;">
                <span class="loading-text">Загрузка деталей счета...</span>
            </div>
            <div id="transactions-container" style="display: none;"></div>
            <div id="transactions-loading" class="loading-indicator" style="display: none;">
                <span class="loading-text">Загрузка транзакций...</span>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2025 Банк NoName. Все права защищены.</p>
    </footer>
</div>

<script type="module" th:src="@{/employee/js/init.js}"></script>
</body>
</html>
