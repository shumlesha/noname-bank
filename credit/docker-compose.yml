version: '3.9'
services:
  postgres:
    container_name: postgres2
    image: postgres:16
    hostname: database
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=creditdb
      - POSTGRES_USER=${POSTGRES_USER:-creditdb}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-creditdb}
    ports:
      - "5430:5432"
volumes:
  pgdata: