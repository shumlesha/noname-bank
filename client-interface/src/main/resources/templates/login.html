<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link rel="stylesheet" th:href="@{/client/css/styles.css}">
</head>
<body>
<div class="container">
    <header class="main-header">
        <div class="logo">
            <h1>NoName Банк</h1>
        </div>
    </header>
    <div class="auth-form">
        <h1>Вход в систему</h1>
        <div id="error-message" class="error-message" style="display: none;"></div>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Войти</button>
            </div>
        </form>
        <div class="form-footer">
            <p>Ещё нет аккаунта? <a th:href="@{/client/register}">Зарегистрироваться</a></p>
        </div>
    </div>
    <footer class="main-footer">
        <p>&copy; 2025 Банк NoName. Все права защищены.</p>
    </footer>
</div>

<script type="module" th:src="@{/client/js/config/config.js}"></script>
<script type="module" th:src="@{/client/js/utils/httpClient.js}"></script>
<script type="module" th:src="@{/client/js/utils/domUtils.js}"></script>
<script type="module" th:src="@{/client/js/core/storageService.js}"></script>
<script type="module" th:src="@{/client/js/core/apiService.js}"></script>
<script type="module" th:src="@{/client/js/core/authService.js}"></script>
<script type="module" th:src="@{/client/js/controllers/LoginController.js}"></script>
<script type="module" th:src="@{/client/js/pages/login.js}"></script>

</body>
</html>
