<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" th:href="@{/client/css/styles.css}">
</head>
<body>
<div class="container">
    <div class="auth-form">
        <h1>Регистрация</h1>
        <div id="error-message" class="error-message" style="display: none;"></div>
        <form id="register-form">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="fullName">Полное имя:</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>
            <div class="form-group">
                <label for="gender">Пол:</label>
                <select id="gender" name="gender" required>
                    <option value="">Выберите пол</option>
                    <option value="MALE">Мужской</option>
                    <option value="FEMALE">Женский</option>
                </select>
            </div>
            <div class="form-group">
                <label>Роль:</label>
                <div class="role-options">
                    <label class="role-option">
                        <input type="checkbox" name="roles" value="CLIENT" checked> Клиент
                    </label>
                    <label class="role-option">
                        <input type="checkbox" name="roles" value="client"> Сотрудник
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Подтвердите пароль:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
            </div>
        </form>
        <div class="form-footer">
            <p>Уже есть аккаунт? <a th:href="@{/client/login}">Войти</a></p>
        </div>
    </div>
</div>

<script th:src="@{/client/js/auth.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initRegisterPage();
    });
</script>
</body>
</html>
