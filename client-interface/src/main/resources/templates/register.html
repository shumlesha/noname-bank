<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" th:href="@{/client/css/styles.css}">
</head>
<body>
<div class="container">
    <header class="main-header">
        <div class="logo">
            <h1>NoName Банк</h1>
        </div>
    </header>
    <div class="auth-form">
        <h1>Регистрация</h1>
        <div id="error-message" class="error-message" style="display: none;"></div>
        <form id="register-form">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="fullName">Полное имя:</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>
            <div class="form-group">
                <label for="gender">Пол:</label>
                <select id="gender" name="gender" required>
                    <option value="">Выберите пол</option>
                    <option value="MALE">Мужской</option>
                    <option value="FEMALE">Женский</option>
                </select>
            </div>
            <div class="form-group">
                <label>Роль:</label>
                <div class="role-options">
                    <label class="role-option">
                        <input type="checkbox" name="roles" value="CLIENT" checked> Клиент
                    </label>
                    <label class="role-option">
                        <input type="checkbox" name="roles" value="EMPLOYEE"> Сотрудник
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required autocomplete="new-password"
                       minlength="8" aria-describedby="password-hint">
                <small id="password-hint" class="form-hint">Пароль должен содержать не менее 8 символов</small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Подтвердите пароль:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
            </div>
        </form>
        <div class="form-footer">
            <p>Уже есть аккаунт? <a th:href="@{/client/login}">Войти</a></p>
        </div>
    </div>
    <footer class="main-footer">
        <p>&copy; 2025 Банк NoName. Все права защищены.</p>
    </footer>
</div>

<script type="module" th:src="@{/client/js/config/config.js}"></script>
<script type="module" th:src="@{/client/js/utils/httpClient.js}"></script>
<script type="module" th:src="@{/client/js/utils/domUtils.js}"></script>
<script type="module" th:src="@{/client/js/core/storageService.js}"></script>
<script type="module" th:src="@{/client/js/core/apiService.js}"></script>
<script type="module" th:src="@{/client/js/core/authService.js}"></script>
<script type="module" th:src="@{/client/js/controllers/RegisterController.js}"></script>
<script type="module" th:src="@{/client/js/pages/register.js}"></script>

</body>
</html>
