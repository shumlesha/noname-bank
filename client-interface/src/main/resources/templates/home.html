<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <link rel="stylesheet" th:href="@{/client/css/styles.css}">
</head>
<body>
<div class="container">
    <header class="main-header">
        <div class="logo">
            <h1>Моё приложение</h1>
        </div>
        <div class="user-info">
            <span id="user-email"></span>
            <button id="logout-btn" class="btn btn-logout">Выйти</button>
        </div>
    </header>

    <div class="main-content">
        <div class="welcome-message">
            <h2>Добро пожаловать!</h2>
            <p>Вы успешно вошли в систему.</p>
        </div>

        <div class="content-section">
            <h3>Ваши данные</h3>
            <div class="user-details">
                <p><strong>ID пользователя:</strong> <span id="user-id"></span></p>
                <p><strong>Email:</strong> <span id="user-email-details"></span></p>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/client/js/auth.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initHomePage();
    });
</script>
</body>
</html>
