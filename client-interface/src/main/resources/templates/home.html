<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <link rel="stylesheet" th:href="@{/client/css/styles.css}">
</head>
<body>
<div class="container">
    <header class="main-header">
        <div class="logo">
            <h1>NoName Банк</h1>
        </div>
        <div class="user-info">
            <span id="user-email"></span>
            <button id="logout-btn" class="btn btn-logout">Выйти</button>
        </div>
    </header>

    <div class="main-content">
        <div class="welcome-message">
            <h2>Добро пожаловать!</h2>
        </div>

        <div class="content-section">
            <h3>Ваши данные</h3>
            <div class="user-details">
                <p><strong>ID пользователя:</strong> <span id="user-id"></span></p>
                <p><strong>Email:</strong> <span id="user-email-details"></span></p>
            </div>
        </div>

        <div class="content-section">
            <h3>Ваши счета</h3>
            <button onclick="createAccount()" class="btn btn-primary">Создать счёт</button>
            <table id="accounts-table">
                <thead>
                <tr>
                    <th>Номер счёта</th>
                    <th>Баланс</th>
                    <th>Тип счета</th>
                    <th>Статус</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody id="accounts-list">
                <tr>
                    <td colspan="5">Загрузка данных...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script th:src="@{/client/js/storageService.js}"></script>
<script th:src="@{/client/js/apiService.js}"></script>
<script th:src="@{/client/js/accountActions.js}"></script>
<script th:src="@{/client/js/auth.js}"></script>
<script th:src="@{/client/js/home.js}"></script>
<script th:src="@{/client/js/main.js}"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        initHomePage();
        loadAccounts();
    });
</script>

</body>
</html>
