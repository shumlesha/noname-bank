<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <link rel="stylesheet" th:href="@{/client/css/styles.css}">
</head>
<body>
<div class="container">
    <header class="main-header">
        <div class="logo">
            <h1>NoName Банк</h1>
        </div>
        <div class="user-info">
            <button id="credits-btn" class="btn btn-secondary">Мои кредиты</button>
            <span id="user-email"></span>
            <button id="logout-btn" class="btn btn-logout">Выйти</button>
        </div>
    </header>

    <div class="main-content">
        <div class="welcome-message">
            <h2>Добро пожаловать!</h2>
        </div>

        <div class="content-section">
            <h3>Ваши данные</h3>
            <div class="user-details">
                <p><strong>ID пользователя:</strong> <span id="user-id"></span></p>
                <p><strong>Email:</strong> <span id="user-email-details"></span></p>
            </div>
        </div>

        <div class="content-section" id="accounts-section">
            <h3>Ваши счета</h3>
            <button id="create-account-btn" class="btn btn-primary">Создать счёт</button>
            <table id="accounts-table">
                <thead>
                <tr>
                    <th>Номер счёта</th>
                    <th>Баланс</th>
                    <th>Тип счета</th>
                    <th>Статус</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody id="accounts-list">
                <tr>
                    <td colspan="5">Загрузка данных...</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="content-section" id="account-details-section" style="display: none;">
            <button id="back-to-accounts-btn" class="btn btn-secondary">Назад</button>
            <div id="account-details">Выберите счет для просмотра информации.</div>

            <h3>История транзакций</h3>
            <table id="transactions-table">
                <thead>
                <tr>
                    <th>Дата</th>
                    <th>Сумма</th>
                    <th>Тип</th>
                </tr>
                </thead>
                <tbody id="transactions-list">
                <tr><td colspan="3">Выберите счет для загрузки транзакций</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script type="module" th:src="@{/client/js/storage/storageService.js}"></script>
<script type="module" th:src="@{/client/js/api/apiService.js}"></script>
<script type="module" th:src="@{/client/js/service/authService.js}"></script>
<script type="module" th:src="@{/client/js/pages/home.js}"></script>

<script>
    document.getElementById('credits-btn').addEventListener('click', function () {
        window.location.href = '/client/credit';
    });
</script>

</body>
</html>
