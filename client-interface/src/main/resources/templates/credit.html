<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои кредиты</title>
    <link rel="stylesheet" th:href="@{/client/css/styles.css}">
</head>
<body>
<div class="container">
    <header class="main-header">
        <div class="logo">
            <h1>NoName Банк</h1>
        </div>
        <div class="user-info">
            <span id="user-email"></span>
            <button id="logout-btn" class="btn btn-logout">Выйти</button>
        </div>
    </header>

    <div class="main-content">
        <button id="back-btn" class="btn btn-secondary">Назад</button>

        <div class="content-section" id="credits-section">
            <h3>Ваши кредиты</h3>
            <button id="fetch-tariffs-btn" class="btn btn-primary">Оформить кредит</button>
            <table id="credits-table">
                <thead>
                <tr>
                    <th>ID кредита</th>
                    <th>Сумма</th>
                    <th>Оплачено</th>
                    <th>Тариф</th>
                    <th>Ставка</th>
                    <th>Статус</th>
                    <th>Дата следующей оплаты</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody id="credits-list">
                <tr><td colspan="7">Загрузка данных...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <footer class="main-footer">
        <p>&copy; 2025 Банк NoName. Все права защищены.</p>
    </footer>
</div>

<div id="tariff-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <span id="close-modal-btn" class="close">&times;</span>
        <h3>Выбрать тариф</h3>
        <table id="tariffs-table">
            <thead>
            <tr>
                <th>Название</th>
                <th>Ставка</th>
                <th>Автоплатеж</th>
                <th>Штраф</th>
                <th>Действие</th>
            </tr>
            </thead>
            <tbody id="tariffs-list">
            <tr><td colspan="3">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module" th:src="@{/client/js/config/config.js}"></script>
<script type="module" th:src="@{/client/js/utils/httpClient.js}"></script>
<script type="module" th:src="@{/client/js/utils/domUtils.js}"></script>
<script type="module" th:src="@{/client/js/core/storageService.js}"></script>
<script type="module" th:src="@{/client/js/core/apiService.js}"></script>
<script type="module" th:src="@{/client/js/core/authService.js}"></script>
<script type="module" th:src="@{/client/js/models/BaseModel.js}"></script>
<script type="module" th:src="@{/client/js/models/User.js}"></script>
<script type="module" th:src="@{/client/js/models/Credit.js}"></script>
<script type="module" th:src="@{/client/js/models/CreditTariff.js}"></script>
<script type="module" th:src="@{/client/js/controllers/CreditController.js}"></script>
<script type="module" th:src="@{/client/js/pages/credit.js}"></script>

</body>
</html>
