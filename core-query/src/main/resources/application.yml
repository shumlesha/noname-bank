spring:
  application:
    name: core-query
  r2dbc:
    url: r2dbc:postgresql://postgres:5432/core-service-query
    username: postgres
    password: postgres
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.yaml
    url: jdbc:postgresql://postgres:5432//core-service-query
    user: ${spring.r2dbc.username}
    password: ${spring.r2dbc.password}
  jpa:
    hibernate:
      ddl-auto: validate

eureka:
  client:
    service-url:
      defaultZone: http://46.29.239.208:8761/eureka/
